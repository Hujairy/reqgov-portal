<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}</style>
<title>ReqGov Traceability Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: SharePoint-style portal — slim site bar, tab nav, one working canvas per view; records read like a bank ledger */
/* Palette taken from the logo: sky #4a98bc, steel #2f6d92, deep #22546d */
:root{
  --bg:#f2f5f8; --surface:#ffffff; --sunk:#e9eff4; --ink:#13222c; --muted:#556773; --line:#d4dee6;
  --accent:#2f6d92; --accent-ink:#ffffff; --accent-soft:#e2eef5; --brass:#2f6d92;
  --logo-sky:#4a98bc; --logo-steel:#2f6d92; --logo-deep:#22546d; --nav:#22546d; --nav-ink:#ffffff; --nav-muted:#b9d3e2;
  --good:#2c7a47; --good-soft:#e3f1e8; --warn:#9c5d00; --warn-soft:#fbefd9; --crit:#b3261e; --crit-soft:#fbe5e3;
  --f-display:"Archivo","Segoe UI",system-ui,sans-serif; --f-body:"Public Sans","Segoe UI",system-ui,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c151b; --surface:#13202a; --sunk:#192a35; --ink:#e3ecf2; --muted:#97aab6; --line:#263a47;
  --accent:#6fb3d4; --accent-ink:#0b161d; --accent-soft:#17323f; --brass:#6fb3d4;
  --logo-sky:#5aaed3; --logo-steel:#3f86b1; --logo-deep:#2e6886; --nav:#122634; --nav-ink:#e3ecf2; --nav-muted:#8fb0c3;
  --good:#6cc58b; --good-soft:#173826; --warn:#e5a94c; --warn-soft:#3a2b12; --crit:#f08a80; --crit-soft:#41201d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c151b; --surface:#13202a; --sunk:#192a35; --ink:#e3ecf2; --muted:#97aab6; --line:#263a47;
  --accent:#6fb3d4; --accent-ink:#0b161d; --accent-soft:#17323f; --brass:#6fb3d4;
  --logo-sky:#5aaed3; --logo-steel:#3f86b1; --logo-deep:#2e6886; --nav:#122634; --nav-ink:#e3ecf2; --nav-muted:#8fb0c3;
  --good:#6cc58b; --good-soft:#173826; --warn:#e5a94c; --warn-soft:#3a2b12; --crit:#f08a80; --crit-soft:#41201d; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:1.6rem;font-weight:700;letter-spacing:-.01em}
h2{font-size:1.15rem;font-weight:600}
h3{font-size:.95rem;font-weight:600}
p{margin:0}
.mono{font-family:var(--f-mono);font-size:.86em}
.muted{color:var(--muted)}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* site bar */
.sitebar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:inset 0 3px 0 var(--logo-sky)}
.logo{height:30px;width:auto;flex:none;display:block}
.brandbar{width:1px;height:30px;background:var(--line);flex:none}
.wrap{max-width:1200px;margin:0 auto;padding-inline:20px}
.sitebar .row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:30px;height:30px;border-radius:6px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:13px;flex:none}
.brand b{font-family:var(--f-display);font-size:1rem;display:block}
.brand small{color:var(--muted);font-size:.78rem}
.spacer{flex:1}
.sample{font-size:.75rem;border:1px dashed var(--brass);color:var(--brass);padding:2px 8px;border-radius:20px;white-space:nowrap}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px 9px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
nav.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs button:hover{color:var(--ink)}
.badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--crit);color:var(--surface);font-size:.7rem;font-weight:600;text-align:center;line-height:18px}

main{padding-block:24px 48px;display:grid;gap:24px}
.pagehead{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;justify-content:space-between}
.pagehead p{max-width:62ch;margin-top:4px}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:6px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--crit)}
.btn.link{border:0;background:none;padding:0;color:var(--accent);font-weight:500}
.btn.link:hover{text-decoration:underline}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px;min-width:0}
.panel > header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}

/* KPI strip */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.kpi{padding:16px 18px;border-right:1px solid var(--line);min-width:0}
.kpi:last-child{border-right:0}
.kpi .v{font-family:var(--f-display);font-size:1.9rem;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1;margin-top:4px}
.kpi .s{color:var(--muted);font-size:.8rem}
.kpi.alert .v{color:var(--crit)}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi:nth-child(2){border-right:0}.kpi:nth-child(-n+2){border-bottom:1px solid var(--line)}}

/* pipeline */
.pipe-scroll{overflow-x:auto}
.pipe{display:grid;grid-template-columns:repeat(7,minmax(132px,1fr));gap:0;min-width:930px}
.stage{padding:0 12px 4px;border-left:1px solid var(--line);display:grid;align-content:start;gap:8px}
.stage:first-child{border-left:0;padding-left:0}
.stage .code{font-family:var(--f-mono);font-size:.75rem;color:var(--accent);font-weight:500}
.stage .ct{color:var(--logo-deep)}
.kpi .v{color:var(--logo-deep)}
.kpi:first-child{box-shadow:inset 3px 0 0 var(--logo-sky)}
.stage .nm{font-weight:600;font-size:.85rem;min-height:2.6em}
.stage .ct{font-family:var(--f-display);font-size:1.6rem;font-weight:600;font-variant-numeric:tabular-nums}
.chiplist{display:grid;gap:6px}
.bcrchip{text-align:left;border:1px solid var(--line);background:var(--sunk);border-radius:6px;padding:6px 8px;cursor:pointer;display:grid;gap:2px;border-left:3px solid var(--line)}
.bcrchip:hover{border-color:var(--accent)}
.bcrchip.breach{border-left-color:var(--crit)}
.bcrchip .mono{color:var(--muted)}
.bcrchip span:last-child{font-size:.8rem;line-height:1.3}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th{text-align:left;font-weight:600;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);background:var(--sunk);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr.clickable{cursor:pointer}
tbody tr.clickable:hover td{background:var(--accent-soft)}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.cellstack{display:grid;gap:4px}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:.75rem;font-weight:600;padding:1px 8px;border-radius:20px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.accent{background:var(--accent-soft);color:var(--accent)}
.pill.plain::before{display:none}

.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.filters input,.filters select,.field input,.field select,.field textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px;min-width:0}
.filters input{flex:1 1 220px}

/* detail */
.crumbs{display:flex;gap:8px;align-items:center;font-size:.85rem;color:var(--muted)}
.detail-head{display:grid;gap:10px}
.detail-head .idline{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px 20px;margin-top:6px}
.meta div{min-width:0}
.meta dd{margin:2px 0 0;font-weight:500;overflow-wrap:anywhere}
.meta dt{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
dl{margin:0}

.stepper{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;list-style:none;margin:0;padding:0}
.stepper li{padding:10px 10px 8px;border-top:4px solid var(--line);display:grid;gap:2px;min-width:0}
.stepper li.done{border-top-color:var(--logo-sky)}
.stepper li.current{border-top-color:var(--accent);background:var(--accent-soft)}
.stepper li.current.breach{border-top-color:var(--crit)}
.stepper .code{font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.stepper .nm{font-size:.8rem;font-weight:600;line-height:1.25}
.stepper .st{font-size:.72rem;color:var(--muted)}
@media (max-width:760px){.stepper{grid-template-columns:repeat(4,minmax(0,1fr))}}

.two{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.two{grid-template-columns:minmax(0,1fr)}}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:900px){.three{grid-template-columns:minmax(0,1fr)}}

.decision{border:1px solid var(--accent);border-radius:8px;padding:18px;background:var(--surface);display:grid;gap:14px}
.decision .criteria{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:.86rem}
.decision .criteria li{display:flex;gap:8px;align-items:flex-start}
.tick{flex:none;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700}
.tick.ok{background:var(--good-soft);color:var(--good)}
.tick.no{background:var(--crit-soft);color:var(--crit)}
.field{display:grid;gap:4px}
.field label{font-size:.8rem;font-weight:600}
.field textarea{resize:vertical;min-height:64px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.msg{font-size:.85rem;padding:8px 10px;border-radius:6px}
.msg.err{background:var(--crit-soft);color:var(--crit)}
.msg.ok{background:var(--good-soft);color:var(--good)}

.card{border:1px solid var(--line);border-radius:8px;padding:14px;background:var(--surface);display:grid;gap:10px;align-content:start;min-width:0}
.card .kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.85rem}
.card .kv span:nth-child(odd){color:var(--muted)}
.empty{color:var(--muted);font-size:.85rem;font-style:italic}

.trace{font-family:var(--f-mono);font-size:.74rem;color:var(--muted)}
.idref{font-family:var(--f-mono);font-size:.82rem;font-weight:500}

.timeline{list-style:none;margin:0;padding:0;display:grid}
.timeline li{display:grid;grid-template-columns:110px 1fr;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.85rem}
.timeline li:last-child{border-bottom:0}
.timeline time{color:var(--muted);font-variant-numeric:tabular-nums;font-size:.78rem}
@media (max-width:520px){.timeline li{grid-template-columns:1fr;gap:2px}}

.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.form-grid .full{grid-column:1/-1}
@media (max-width:640px){.form-grid{grid-template-columns:minmax(0,1fr)}}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.88rem}
.checks label{display:flex;gap:6px;align-items:center;font-weight:400}

.ref-levels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:900px){.ref-levels{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.ref-levels{grid-template-columns:minmax(0,1fr)}}
.lvl{border:1px solid var(--line);border-radius:8px;padding:14px;background:var(--surface);display:grid;gap:6px;align-content:start}
.lvl .n{font-family:var(--f-mono);font-size:.75rem;color:var(--accent);font-weight:500}
.lvl p{font-size:.85rem;color:var(--muted)}
.lvl .fields{font-size:.8rem}

details.history > summary{display:flex;align-items:center;gap:12px;cursor:pointer;list-style:none}
details.history > summary::-webkit-details-marker{display:none}
details.history > summary::before{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);flex:none;margin-right:2px}
details.history[open] > summary::before{transform:rotate(45deg)}
@media (prefers-reduced-motion:no-preference){details.history > summary::before{transition:transform .15s}}
.admin{display:grid;grid-template-columns:minmax(200px,240px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:820px){.admin{grid-template-columns:minmax(0,1fr)}}
.adminnav{display:grid;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px}
@media (max-width:820px){.adminnav{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}}
.adminnav button{display:flex;justify-content:space-between;gap:8px;text-align:left;background:none;border:0;border-radius:6px;padding:8px 10px;cursor:pointer;font-weight:500}
.adminnav button:hover{background:var(--sunk)}
.adminnav button[aria-current="true"]{background:var(--accent-soft);color:var(--accent)}
.admin td input:not([type=checkbox]),.admin td select,#admadd input,#admadd select{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 9px;width:100%}
.admin td input:disabled{background:var(--sunk);color:var(--muted)}
.inline-form{border:1px dashed var(--accent);border-radius:8px;padding:16px;background:var(--accent-soft)}
.inline-form .field input,.inline-form .field select,.inline-form .field textarea{background:var(--surface)}
.btn.small{font-size:.8rem}
.linkbtn{background:none;border:0;padding:0;cursor:pointer;color:var(--accent);text-align:left;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px}
.linkbtn:hover{text-decoration-style:solid}
.viewgrid{display:grid;grid-template-columns:minmax(120px,auto) 1fr;gap:8px 16px;font-size:.88rem}
.viewgrid > span:nth-child(odd){color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;font-weight:600;padding-top:2px}
.viewgrid > span{min-width:0;overflow-wrap:anywhere;white-space:pre-line}
@media (max-width:520px){.viewgrid{grid-template-columns:minmax(0,1fr)}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;font-size:.88rem;max-width:calc(100% - 32px);z-index:10}
footer{color:var(--muted);font-size:.78rem;padding-block:0 32px}
@media (prefers-reduced-motion:no-preference){.bcrchip,.btn,tbody tr.clickable td{transition:background .15s,border-color .15s}}
</style>
</head>
<body>

<header class="sitebar">
  <div class="wrap">
    <div class="row">
      <div class="brand">
        <svg class="logo" viewBox="0 0 220 136" role="img" aria-label="Logo"><polygon points="0,0 40,0 84,136 44,136" fill="var(--logo-sky)"/><rect x="98" y="0" width="40" height="136" fill="var(--logo-steel)"/><path d="M152 0A68 68 0 0 1 152 136Z" fill="var(--logo-deep)"/></svg>
        <span class="brandbar" aria-hidden="true"></span>
        <div><b>Requirements Governance</b><small>IT Governance Hub › /sites/ReqGov</small></div>
      </div>
      <div class="spacer"></div>
      <span class="sample">Prototype · sample data</span>
      <button class="btn" data-act="reset" type="button">Reset demo</button>
    </div>
    <nav class="tabs" aria-label="Site sections" id="tabs"></nav>
  </div>
</header>

<main class="wrap" id="app"></main>
<div class="toast" id="toast" hidden></div>

<script>
const TODAY = '2026-10-11';
const GATES = [
  {g:0, code:'L0', name:'Submission check', sla:0, who:'Automatic validation (flow F1)'},
  {g:1, code:'L1', name:'BCR approval', sla:5, who:'Business Sponsor, then Demand Manager'},
  {g:2, code:'L2', name:'FR approval', sla:5, who:'System Owner approves each FR; Lead BA confirms'},
  {g:3, code:'L3', name:'BR approval & baseline', sla:5, who:'Business Owner approves each BR; Lead BA baselines'},
  {g:4, code:'L4', name:'Solution assessment', sla:10, who:'ARB, InfoSec and Risk approve the SA; ARB chair confirms'},
  {g:5, code:'L5', name:'UAT sign-off', sla:3, who:'QA Lead approves tests; Business Owner signs UAT; Governance Office confirms'},
  {g:6, code:'L6', name:'CAB & release', sla:7, who:'Change Manager / CAB approve; PIR completed; Change Manager closes'}
];
const STATUS_AT = {1:'Submitted',2:'Approved · FRs in review',3:'BRs in review',4:'Under ARB review',5:'UAT pending sign-off',6:'Awaiting CAB',7:'Closed'};
const PEOPLE = {
  demand:'Noora Abdulla', ba:'Maryam Hasan', sysown:'Yusuf Mahmood', arb:'Ali Radhi', infosec:'Hussain Ali', chg:'Sara Ebrahim', qa:'Omar Saleh'
};
const OK_FR = ['Approved','Built','Verified'], OK_BR = ['Approved','Baselined','Verified'], PENDING = ['Draft','Change Requested'];
const stKind = s => OK_FR.includes(s) || OK_BR.includes(s) ? 'good' : s === 'Change Requested' ? 'warn' : s === 'Rejected' ? 'crit' : '';
/* Customisable dropdown lists (Admin page). `locked` values drive workflow rules and cannot be renamed or removed. */
const ROUTES = {'cm-cab':'Change Manager, then CAB', 'cm':'Change Manager only', 'ecab':'Emergency CAB (may precede UAT sign-off)'};
const DEFAULT_LISTS = {
  areas:{label:'Business areas', where:'New BCR form and register filter', values:['Retail Banking','Corporate Banking','Digital Channels','Compliance','Cards']},
  bcrPriority:{label:'BCR priority', where:'New BCR form and register filter', values:['Critical','High','Medium','Low']},
  systems:{label:'Impacted systems', where:'BCR, functional requirements and solution assessment. The System Owner approves FRs for the system.', attr:'owner', values:[
    {v:'Core Banking', owner:'Yusuf Mahmood'},{v:'Payments Hub', owner:'Nadia Fardan'},{v:'Mobile App', owner:'Sayed Jaffar'},{v:'Internet Banking', owner:'Sayed Jaffar'},{v:'Data Warehouse', owner:'Mariam Ghuloom'},
    {v:'Trade Finance', owner:'Abbas Hilal'},{v:'AML Platform', owner:'Nadia Fardan'},{v:'Branch Systems', owner:'Yusuf Mahmood'},{v:'Card Management', owner:'Abbas Hilal'}]},
  brPriority:{label:'BR priority', where:'Business requirement form', values:['Must','Should','Could',"Won't"]},
  complexity:{label:'FR complexity', where:'Functional requirement form', values:['Low','Medium','High','Very High']},
  vendor:{label:'Vendor involvement', where:'Solution assessment. Any value other than None adds a Third-Party Risk reviewer.', locked:['None'], values:['None','Existing Vendor','New Vendor']},
  approach:{label:'Implementation approaches', where:'Solution assessment', values:['Configuration','In-house Development','Vendor Package','Integration','Hybrid']},
  risk:{label:'Risk ratings', where:'Solution assessment and change requests', attr:'oprisk', values:[{v:'Low'},{v:'Medium'},{v:'High', oprisk:true},{v:'Critical', oprisk:true}]},
  testTypes:{label:'Test types', where:'Test case form', values:['SIT','UAT','Regression','Security','Performance']},
  testResults:{label:'Test results', where:'Record test result. Only Pass counts toward UAT readiness; Fail needs a defect reference.', locked:['Pass','Fail'], values:['Pass','Fail','Blocked']},
  chgType:{label:'Change types', where:'Change request form. The approval route decides who approves the change.', attr:'route', values:[{v:'Normal', route:'cm-cab'},{v:'Standard', route:'cm'},{v:'Emergency', route:'ecab'}]},
  deployOutcomes:{label:'Deployment outcomes', where:'Record deployment. Deployed opens the post-implementation review.', locked:['Deployed'], values:['Deployed','Failed','Rolled Back']},
  pirOutcomes:{label:'PIR outcomes', where:'Post-implementation review', values:['Successful','Issues Raised']}
};
function buildLists(){
  const out = {};
  Object.entries(DEFAULT_LISTS).forEach(([k, d]) => { out[k] = {...d, locked:[...(d.locked || [])], values:d.values.map(x => typeof x === 'string' ? {v:x} : {...x})}; });
  return out;
}
const L = key => DB.lists[key].values.map(x => x.v);
const listAttr = (key, v, a) => DB.lists[key].values.find(x => x.v === v)?.[a];

function workdays(from, to){ // Bahrain working week: Sunday–Thursday
  let n = 0; const a = new Date(from+'T12:00:00Z'), b = new Date(to+'T12:00:00Z');
  for (let d = new Date(a); d < b; d.setUTCDate(d.getUTCDate()+1)){ const w = d.getUTCDay(); if (w !== 5 && w !== 6) n++; }
  return n;
}
function addDays(d, n){ const x = new Date(d+'T12:00:00Z'); x.setUTCDate(x.getUTCDate()+n); return x.toISOString().slice(0,10); }
function nowStamp(){ const d = new Date(); return `${TODAY}T${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }

const isOpen = b => b.gate < 7;
const daysAtGate = b => workdays(b.since, TODAY);
const isBreach = b => isOpen(b) && b.gate >= 1 && daysAtGate(b) > GATES[b.gate].sla;
const statusOf = b => b.returned ? `Returned at ${GATES[b.gate].code}` : STATUS_AT[b.gate];

function pill(text, kind=''){ return `<span class="pill ${kind}">${esc(text)}</span>`; }
const priKind = p => ({Critical:'crit', High:'warn', Must:'accent'}[p] || '');

function statusKind(b){ if (b.gate === 7) return 'good'; if (b.returned) return 'crit'; if (isBreach(b)) return 'crit'; return 'accent'; }

function log(who, act, rec, det){ DB.audit.unshift({t:nowStamp(), who, act, rec, det}); }

function exceptions(){
  const out = [];
  DB.bcrs.forEach(b => {
    if (!isOpen(b)) return;
    if (isBreach(b)) out.push({sev:'Medium', rule:'Level SLA', bcr:b.id, txt:`${GATES[b.gate].code} ${GATES[b.gate].name}: ${daysAtGate(b)} working days against a ${GATES[b.gate].sla}-day SLA`});
    b.brs.filter(r => r.status === 'Baselined').forEach(r => {
      if (!r.frs.length) out.push({sev:'Medium', rule:'BR coverage', bcr:b.id, txt:`${r.id} has no functional requirement`});
      if (!r.tcs.length) out.push({sev:'High', rule:'Test coverage', bcr:b.id, txt:`${r.id} has no test case`});
    });
    if (b.chg && b.chg.cab === 'Approved' && !(b.uat && b.uat.status === 'Signed Off')) out.push({sev:'Critical', rule:'Acceptance before release', bcr:b.id, txt:`${b.chg.id} approved without UAT sign-off`});
  });
  const order = {Critical:0, High:1, Medium:2, Low:3};
  return out.sort((a,b) => order[a.sev]-order[b.sev]);
}

function criteria(b){
  const g = b.gate, c = [];
  if (g === 1) c.push({ok:b.sponsor !== b.requestor, t:'Sponsor is not the requestor'}, {ok:b.just.length > 20, t:'Business justification provided'});
  if (g === 2){ c.push({ok:b.brs.length > 0, t:'At least one business requirement'});
    b.brs.forEach(r => c.push({ok:r.frs.length > 0 && r.frs.every(f => OK_FR.includes(f.st)), t:`${r.id}: ${r.frs.filter(f => OK_FR.includes(f.st)).length} of ${r.frs.length} FRs approved`})); }
  if (g === 3) b.brs.forEach(r => c.push({ok:OK_BR.includes(r.status), t:`${r.id} approved by its Business Owner`}));
  if (g === 4){ c.push({ok:!!b.sa, t:'Solution assessment recorded'}); if (b.sa) b.sa.approvals.forEach(ap => c.push({ok:SA_DONE.includes(ap.st), t:`${ap.role}: ${ap.st}`}));
    c.push({ok:!!b.sa && b.sa.status === 'Approved', t:'Solution assessment approved by every reviewer'}, {ok:b.brs.every(r=>r.frs.length), t:'All BRs decomposed into FRs'}); }
  if (g === 5){ b.brs.forEach(r => c.push({ok:r.tcs.some(t => t.ds === 'Approved'), t:`${r.id} has an approved test case`}));
    const all = b.brs.flatMap(r=>r.tcs); c.push({ok:all.length && all.every(t=>t.r==='Pass'), t:`All test cases pass (${all.filter(t=>t.r==='Pass').length} of ${all.length})`});
    c.push({ok:!!(b.uat && b.uat.status==='Signed Off'), t:'UAT signed off by the Business Owner'}); }
  if (g === 6){ const ch = b.chg;
    c.push({ok:!!ch, t:'Change request raised'}, {ok:!!ch && ch.status==='Approved', t:'Change approved (CAB / Change Manager / ECAB)'},
      {ok:!!ch && ch.deploy==='Deployed', t:'Deployment recorded as successful'}, {ok:!!ch && String(ch.pir).startsWith('Completed'), t:'Post-implementation review completed'}); }
  return c;
}
function approverOptions(b){

  const list = [...(map[b.gate]||[])];
  [b.requestor, PEOPLE.qa].forEach(p => { if (!list.includes(p)) list.push(p); });

}

    body = `<p class="full"><b>${esc(br.title)}</b><br>${esc(br.stmt)}</p>${kv({'Acceptance criteria':esc(br.ac), 'Priority':esc(br.pri), 'Status':pill(br.status, stKind(br.status)), 'Approver':`${esc(approver)} (Business Owner)`,
      'Functional requirements': br.frs.length ? br.frs.map(x => `<span class="idref">${x.id}</span> ${pill(x.st, stKind(x.st))}`).join(' ') : '<span class="muted">None yet</span>'})}
      ${blockers.length || !br.frs.length ? `<div class="msg err full">This BR cannot be approved yet. ${br.frs.length ? `Approve ${blockers.map(x => x.id).join(', ')} first.` : 'Add and approve at least one functional requirement first.'}</div>` : ''}`;
  }
  const status = f.kind === 'rfr' ? item.st : item.status;
  const author = item.author || PEOPLE.ba;
  const opts = [...new Set([approver, author])];
  const trace = f.kind === 'rfr' ? `${b.id} / ${br.id} / ${item.id}` : `${b.id} / ${br.id}`;
  const blocked = f.kind === 'rbr' && (blockers.length > 0 || !br.frs.length);
  const buttons = status === 'Rejected'
    ? `<button class="btn primary" type="submit" data-decision="resubmit">Revise and resubmit</button>`
    : `<button class="btn primary" type="submit" data-decision="approve" ${blocked ? 'disabled' : ''}>Approve ${item.id}</button><button class="btn danger" type="submit" data-decision="reject">Reject</button>`;
  return `<form class="inline-form form-grid" id="reviewitem" novalidate>
    <div class="full"><div class="label">${head}</div><h3 style="margin-top:2px"><span class="idref">${trace}</span></h3></div>
    ${body}
    <div class="field"><label for="rv-who">Decision recorded by</label><select id="rv-who">${opts.map(o => `<option>${esc(o)}</option>`).join('')}</select></div>
    <div class="field"><label for="rv-note">Comments</label><textarea id="rv-note" placeholder="Required when rejecting"></textarea></div>
    ${err}<div class="actions full">${buttons}<button class="btn" type="button" data-act="cancelform">Cancel</button></div></form>`;
}

function submitReview(decision){
  const b = getBcr(state.bcr), f = state.form, br = b.brs.find(r => r.id === f.br);
  const isFr = f.kind === 'rfr', item = isFr ? br.frs.find(x => x.id === f.fr) : br;
  const who = document.getElementById('rv-who').value, note = document.getElementById('rv-note').value.trim();
  const trace = isFr ? `${b.id} / ${br.id} / ${item.id}` : `${b.id} / ${br.id}`;
  const approver = isFr ? (sysOwner(item.sys)) : br.owner;
  const author = item.author || PEOPLE.ba;
  const label = isFr ? 'FR' : 'BR';
  const setSt = v => { if (isFr) item.st = v; else item.status = v; };
  if (decision === 'resubmit'){
    setSt(isFr ? (b.gate > 2 ? 'Change Requested' : 'Draft') : (b.gate > 3 ? 'Change Requested' : 'Draft'));
    log(author, `${label} resubmitted`, trace, note || 'Revised after rejection');
    state.form = null; toast(`${item.id} resubmitted for approval`); return render();
  }
  if (who === author && who !== approver) return formError(`Segregation of duties: ${who} wrote this requirement and cannot approve or reject it.`);
  if (who !== approver) return formError(`${who} is not the approver. ${isFr ? 'The System Owner of ' + item.sys : 'The Business Owner'} (${approver}) decides this ${label}.`);
  if (decision === 'reject'){
    if (!note) return formError('Add a comment so the author knows what to change.');
    setSt('Rejected'); log(who, `${label} rejected`, trace, note);
    state.form = null; toast(`${item.id} rejected`); return render();
  }
  if (!isFr){
    const pending = br.frs.filter(x => !OK_FR.includes(x.st));
    if (!br.frs.length) return formError('This BR has no functional requirements. Add and approve at least one first.');
    if (pending.length){ log('svc-reqgov (flow F3)', 'BR approval blocked', trace, `Pending FRs: ${pending.map(x => x.id).join(', ')}`); return formError(`Approve ${pending.map(x => x.id).join(', ')} before this BR.`); }
  }
  setSt(isFr ? 'Approved' : (b.gate > 3 ? 'Baselined' : 'Approved'));
  log(who, `${label} approved`, trace, note || (isFr ? 'Approved by System Owner' : 'Approved by Business Owner; all FRs approved'));
  state.form = null; toast(`${item.id} approved`); render();
}

function saveEdit(){
  const b = getBcr(state.bcr), f = state.form, br = b.brs.find(r => r.id === f.br);
  const v = id => document.getElementById(id).value.trim();
  if (f.kind === 'efr'){
    const fr = br.frs.find(x => x.id === f.fr), trace = `${b.id} / ${br.id} / ${fr.id}`;
    if (!v('fr-desc')) return formError('The functional requirement cannot be empty.');
    const next = {d:v('fr-desc'), sys:v('fr-sys'), cx:v('fr-cx')}, names = {d:'requirement text', sys:'impacted system', cx:'complexity'};
    const changed = Object.keys(next).filter(k => next[k] !== fr[k]);
    if (!changed.length) return formError('Nothing has changed.');
    const reopen = OK_FR.includes(fr.st);
    Object.assign(fr, next); fr.ver = (fr.ver || 1) + 1;
    if (reopen) fr.st = 'Change Requested';
    log(PEOPLE.ba, 'FR edited', trace, `Version ${fr.ver}: changed ${changed.map(k => names[k]).join(', ')}${reopen ? `; re-approval required from ${sysOwner(fr.sys)}` : ''}`);
    if (reopen && OK_BR.includes(br.status)){ br.status = 'Change Requested'; log('svc-reqgov (flow F3)', 'BR reopened', `${b.id} / ${br.id}`, `${fr.id} changed and is pending re-approval`); }
    state.form = {kind:'vfr', br:br.id, fr:fr.id}; toast(`${fr.id} saved as version ${fr.ver}`); return render();
  }
  const trace = `${b.id} / ${br.id}`;
  const req = [['br-title','title'],['br-stmt','requirement statement'],['br-ac','acceptance criteria']].filter(([id]) => !v(id)).map(([,n]) => n);
  if (req.length) return formError(`Add the ${req.join(', ')}.`);
  const next = {title:v('br-title'), stmt:v('br-stmt'), just:v('br-just'), ac:v('br-ac'), pri:v('br-pri'), owner:v('br-owner')};
  const names = {title:'title', stmt:'statement', just:'justification', ac:'acceptance criteria', pri:'priority', owner:'business owner'};
  const changed = Object.keys(next).filter(k => next[k] !== (br[k] || ''));
  if (!changed.length) return formError('Nothing has changed.');
  const reopen = OK_BR.includes(br.status);
  Object.assign(br, next); br.ver = (br.ver || 1) + 1;
  if (reopen) br.status = 'Change Requested';
  log(PEOPLE.ba, 'BR edited', trace, `Version ${br.ver}: changed ${changed.map(k => names[k]).join(', ')}${reopen ? `; re-approval required from ${br.owner}` : ''}`);
  state.form = {kind:'vbr', br:br.id}; toast(`${br.id} saved as version ${br.ver}`); render();
}

function submitBr(){

/* ---------- Level 4: solution assessment ---------- */
const SA_AUTHOR = 'Rashid Isa';
const SA_DONE = ['Approved','Approved with Conditions'];
function saReviewers(sa){
  const r = [{role:'Enterprise Architecture (ARB)', who:PEOPLE.arb}, {role:'Information Security', who:PEOPLE.infosec}];
  if (sa.vendor !== 'None') r.push({role:'Third-Party Risk', who:'Dana Mattar'});
  if (listAttr('risk', sa.risk, 'oprisk')) r.push({role:'Operational Risk', who:'Fadhel Mahdi'});
  return r;
}
function normalize(db){
  DB = db; if (!db.lists) db.lists = buildLists();
  db.bcrs.forEach(b => {
    b.brs.forEach(r => r.tcs.forEach(t => Object.assign(t, {ds:t.ds || 'Approved', type:t.type || 'SIT', author:t.author || 'Omar Saleh', on:t.on || (t.by ? '2026-10-08' : null), defect:t.defect || ''})));
    b.tcSeq = maxNum(b.brs.flatMap(r => r.tcs.map(t => t.id)));
    b.uatSeq = b.uat ? 1 : 0;
    if (b.uat && !b.uat.author){
      const winEnd = b.uat.date || '2026-10-08';
      Object.assign(b.uat, {author:QA_LEAD, start:addDays(winEnd, -10), end:winEnd, scope:'End-to-end business journeys for every baselined BR, in the UAT environment with masked production data.', note:'', ver:1});
      if (b.uat.result === '—') b.uat.result = '';
    }
    if (b.chg && !b.chg.approvals){
      const c = b.chg; Object.assign(c, {author:CHG_AUTHOR, ver:1, window:'Fri 23:00–02:00', rollback:'Redeploy the previous release package and restore configuration from the pre-change backup.'});
      const revs = chgReviewers(c.type);
      if (c.cab === 'Approved'){ c.status = 'Approved'; c.approvals = revs.map(r => ({...r, st:'Approved', note:''})); }
      else { c.status = 'Submitted'; c.deploy = 'Not Scheduled'; c.approvals = revs.map((r, i) => ({...r, st: i === 0 ? 'Approved' : 'Pending', note:''})); }
    }
    b.saSeq = b.sa ? 1 : 0;
    const sa = b.sa; if (!sa || sa.approvals) return;
    sa.systems = sa.systems || [...b.systems]; sa.author = SA_AUTHOR;
    const a = (sa.approach || '').toLowerCase();
    sa.atype = a.includes('vendor package') ? 'Vendor Package' : a.includes('configuration and') ? 'Hybrid' : a.startsWith('configuration') ? 'Configuration' : a.includes('integration') ? 'Integration' : 'Hybrid';
    if (sa.status === 'Under ARB Review') sa.status = 'Submitted';
    const done = sa.status === 'Approved';
    sa.approvals = saReviewers(sa).map(r => ({...r, st: done ? (r.role.startsWith('Enterprise') && sa.arch === 'Approved with Conditions' ? 'Approved with Conditions' : 'Approved') : 'Pending', note:''}));
  });
  return db;
}
const saCanChange = b => isOpen(b) && b.gate >= 2 && b.gate <= 4;

function saCard(b){

    ${saCanChange(b) && !busy ? '<button class="btn" type="button" data-act="sa" data-kind="sa-add" style="justify-self:start">+ Add solution assessment</button>' : ''}</section>`;
  const kind = sa.status === 'Approved' ? 'good' : sa.status === 'Rejected' ? 'crit' : sa.status === 'Draft' ? '' : 'accent';
  const btns = [];
  if (saCanChange(b) && !busy){
    btns.push(`<button class="btn small" type="button" data-act="sa" data-kind="sa-edit">Edit</button>`);
    if (sa.status === 'Draft' || sa.status === 'Rejected') btns.push(`<button class="btn small primary" type="button" data-act="sasubmit">Submit for approval</button>`, `<button class="btn small danger" type="button" data-act="sa" data-kind="sa-delete">Delete</button>`);
  }

    <div class="kv"><span>Vendor</span><span>${esc(sa.vendor)}${sa.vname ? ' · ' + esc(sa.vname) : ''}</span><span>Approach</span><span>${esc(sa.atype)}${sa.approach ? '<br><span class="muted">' + esc(sa.approach) + '</span>' : ''}</span>
      <span>Risk rating</span><span>${pill(sa.risk, priKind(sa.risk))}</span><span>Effort</span><span>${sa.effort} person-days</span><span>Systems</span><span>${sa.systems.map(esc).join(', ')}</span>
      <span>Architecture</span><span>${esc(sa.arch)}</span><span>InfoSec</span><span>${esc(sa.sec)}</span><span>Version</span><span>${sa.ver || 1}</span></div>
    ${sa.status !== 'Draft' ? `<div style="display:grid;gap:6px"><div class="label">Approvals (all required)</div>
      ${sa.approvals.map((ap, i) => `<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:.83rem"><span style="flex:1 1 140px;min-width:0">${esc(ap.role)}<br><span class="muted">${esc(ap.who)}</span></span>${pill(ap.st, SA_DONE.includes(ap.st) ? 'good' : ap.st === 'Rejected' ? 'crit' : '')}
        ${ap.st === 'Pending' && sa.status === 'Submitted' && isOpen(b) && !busy ? `<button class="btn link small" type="button" data-act="sa" data-kind="sa-review" data-role="${i}">Review</button>` : ''}</div>`).join('')}</div>` : '<p class="muted" style="font-size:.82rem">Draft. Submit it to send it to ARB, InfoSec and any risk reviewers.</p>'}
    ${btns.length ? `<div class="actions">${btns.join('')}</div>` : ''}</section>`;
}

function saForm(b){
  const f = state.form; if (!f || !String(f.kind).startsWith('sa-')) return '';
  const err = '<div class="msg err full" id="form-err" role="alert" hidden></div>';

  const sa = b.sa;
  if (f.kind === 'sa-delete') return `<section class="panel" id="saform" style="border-color:var(--crit);display:grid;gap:12px">
    <h2>Delete ${b.id} / ${sa.id}?</h2><p>The assessment is moved to the site recycle bin and removed from this BCR. The deletion is kept in the audit log, and the next assessment gets a new ID.</p>
    <div class="field" style="max-width:520px"><label for="sa-delnote">Reason for deletion</label><textarea id="sa-delnote" placeholder="Required"></textarea></div>${err}
    <div class="actions"><button class="btn danger" type="button" data-act="sadelete">Delete assessment</button>${cancel}</div></section>`;
  if (f.kind === 'sa-review'){
    const ap = sa.approvals[Number(f.role)];
    return `<form class="inline-form form-grid" id="sareview" novalidate>
      <div class="full"><div class="label">Review solution assessment · ${esc(ap.role)}</div><h3 style="margin-top:2px"><span class="idref">${b.id} / ${sa.id}</span></h3>
        <p class="muted" style="font-size:.85rem;margin-top:4px">${esc(sa.atype)}, ${esc(sa.vendor.toLowerCase())} vendor involvement, ${esc(sa.risk.toLowerCase())} risk, ${sa.effort} person-days. Every reviewer must approve before L4.</p></div>
      <div class="field"><label for="rv-who">Decision recorded by</label><select id="rv-who">${[...new Set([ap.who, sa.author])].map(o => `<option>${esc(o)}</option>`).join('')}</select></div>
      <div class="field"><label for="rv-note">Comments or conditions</label><textarea id="rv-note" placeholder="Required for conditions or rejection"></textarea></div>
      ${err}<div class="actions full"><button class="btn primary" type="submit" data-decision="approve">Approve</button><button class="btn" type="submit" data-decision="conditions">Approve with conditions</button><button class="btn danger" type="submit" data-decision="reject">Reject</button>${cancel}</div></form>`;
  }
  const v = sa && f.kind === 'sa-edit' ? sa : {systems:[...b.systems], vendor:'None', vname:'', atype:L('approach')[0], approach:'', risk:L('risk')[1] || L('risk')[0], effort:''};
  const id = f.kind === 'sa-edit' ? sa.id : 'SA-' + pad3(b.saSeq + 1);
  const allSys = [...b.systems, ...L('systems').filter(s => !b.systems.includes(s))];
  const warn = f.kind === 'sa-edit' && sa.status !== 'Draft' ? `<p class="muted" style="font-size:.85rem;margin-top:4px">This assessment is ${sa.status.toLowerCase()}. Saving a change returns it to Draft, clears the approvals, and it must be submitted again.</p>` : '';
  return `<form class="inline-form form-grid" id="saedit" novalidate>
    <div class="full"><div class="label">${f.kind === 'sa-edit' ? 'Edit' : 'New'} solution assessment</div><h3 style="margin-top:2px"><span class="idref">${b.id} / ${id}</span></h3>${warn}</div>
    <fieldset class="field full" style="border:0;padding:0;margin:0"><legend style="font-size:.8rem;font-weight:600;margin-bottom:4px">Impacted systems</legend>
      <div class="checks">${allSys.map((s,i) => `<label><input type="checkbox" id="sa-sys-${i}" value="${esc(s)}" ${v.systems.includes(s)?'checked':''}> ${esc(s)}</label>`).join('')}</div></fieldset>
    <div class="field"><label for="sa-vendor">Vendor involvement</label><select id="sa-vendor">${L('vendor').map(o => `<option ${o===v.vendor?'selected':''}>${o}</option>`).join('')}</select></div>
    <div class="field"><label for="sa-vname">Vendor name</label><input id="sa-vname" value="${esc(v.vname || '')}" placeholder="Required when a vendor is involved"></div>
    <div class="field"><label for="sa-atype">Implementation approach</label><select id="sa-atype">${L('approach').map(o => `<option ${o===v.atype?'selected':''}>${o}</option>`).join('')}</select></div>
    <div class="field"><label for="sa-effort">Estimated effort (person-days)</label><input id="sa-effort" type="number" min="1" step="1" value="${esc(v.effort)}"></div>
    <div class="field"><label for="sa-risk">Risk rating</label><select id="sa-risk">${L('risk').map(o => `<option ${o===v.risk?'selected':''}>${o}</option>`).join('')}</select></div>
    <div class="field full"><label for="sa-approach">Approach description and key risks</label><textarea id="sa-approach" placeholder="How the solution will be delivered, dependencies, and the main architectural risks">${esc(v.approach || '')}</textarea></div>
    <p class="muted full" style="font-size:.82rem">Reviewers: ARB and Information Security always; Third-Party Risk when a vendor is involved; Operational Risk when risk is ${esc(L('risk').filter(r => listAttr('risk', r, 'oprisk')).join(' or ') || 'flagged in Admin')}.</p>
    ${err}<div class="actions full"><button class="btn primary" type="submit">${f.kind === 'sa-edit' ? 'Save changes' : 'Save as draft'}</button>${cancel}</div></form>`;
}

function saSave(){
  const b = getBcr(state.bcr), f = state.form, v = id => document.getElementById(id).value.trim();
  const allSys = [...b.systems, ...L('systems').filter(s => !b.systems.includes(s))];
  const systems = allSys.filter((s,i) => document.getElementById('sa-sys-'+i).checked);
  const next = {systems, vendor:v('sa-vendor'), vname:v('sa-vendor') === 'None' ? '' : v('sa-vname'), atype:v('sa-atype'), approach:v('sa-approach'), risk:v('sa-risk'), effort:Number(v('sa-effort'))};
  const miss = [];
  if (!systems.length) miss.push('at least one impacted system');
  if (next.vendor !== 'None' && !next.vname) miss.push('the vendor name');
  if (!(next.effort > 0)) miss.push('the estimated effort');
  if (!next.approach) miss.push('the approach description');
  if (miss.length) return formError(`Add ${miss.join(', ')}.`);
  if (f.kind === 'sa-add'){
    b.saSeq += 1; const id = 'SA-' + pad3(b.saSeq);
    b.sa = {id, ...next, status:'Draft', arch:'Pending', sec:'Not reviewed', author:SA_AUTHOR, ver:1, approvals:[]};
    log(SA_AUTHOR, 'Solution assessment created', `${b.id} / ${id}`, `Draft: ${next.atype}, ${next.vendor}, ${next.risk} risk, ${next.effort} person-days`);
    state.form = null; toast(`${id} saved as draft`); return render();
  }
  const sa = b.sa, names = {systems:'impacted systems', vendor:'vendor involvement', vname:'vendor name', atype:'approach', approach:'approach description', risk:'risk rating', effort:'effort'};
  const changed = Object.keys(next).filter(k => JSON.stringify(next[k]) !== JSON.stringify(sa[k] ?? (k === 'vname' ? '' : undefined)));
  if (!changed.length) return formError('Nothing has changed.');
  const wasLive = sa.status !== 'Draft';
  Object.assign(sa, next); sa.ver = (sa.ver || 1) + 1;
  if (wasLive){ sa.status = 'Draft'; sa.arch = 'Pending'; sa.sec = 'Not reviewed'; sa.approvals = []; }
  log(SA_AUTHOR, 'Solution assessment edited', `${b.id} / ${sa.id}`, `Version ${sa.ver}: changed ${changed.map(k => names[k]).join(', ')}${wasLive ? '; returned to Draft, approvals cleared' : ''}`);
  state.form = null; toast(`${sa.id} saved as version ${sa.ver}`); render();
}

function saSubmit(){
  const b = getBcr(state.bcr), sa = b.sa;
  sa.status = 'Submitted'; sa.arch = 'Pending'; sa.sec = 'Pending';
  sa.approvals = saReviewers(sa).map(r => ({...r, st:'Pending', note:''}));
  log('svc-reqgov (flow F5)', 'Assessment submitted for review', `${b.id} / ${sa.id}`, `Parallel approval sent to ${sa.approvals.map(a => a.role).join(', ')}`);
  toast(`${sa.id} sent to ${sa.approvals.length} reviewers`); render();
}

function saReview(decision){
  const b = getBcr(state.bcr), sa = b.sa, ap = sa.approvals[Number(state.form.role)];
  const who = document.getElementById('rv-who').value, note = document.getElementById('rv-note').value.trim();
  if (who === sa.author && who !== ap.who) return formError(`Segregation of duties: ${who} wrote this assessment and cannot review it.`);
  if (who !== ap.who) return formError(`${ap.role} decides this review (${ap.who}).`);
  if (decision !== 'approve' && !note) return formError(decision === 'reject' ? 'Add a comment explaining the rejection.' : 'Write the conditions in the comments.');
  ap.st = decision === 'reject' ? 'Rejected' : decision === 'conditions' ? 'Approved with Conditions' : 'Approved'; ap.note = note;
  log(who, `SA ${ap.st.toLowerCase()}`, `${b.id} / ${sa.id}`, `${ap.role}${note ? ': ' + note : ''}`);
  if (ap.role.startsWith('Information')) sa.sec = ap.st === 'Rejected' ? 'Not cleared' : ap.st === 'Approved' ? 'Cleared' : 'Cleared with Conditions';
  if (ap.role.startsWith('Enterprise')) sa.arch = ap.st;
  if (ap.st === 'Rejected'){ sa.status = 'Rejected'; log('svc-reqgov (flow F5)', 'Assessment rejected', `${b.id} / ${sa.id}`, `Rejected by ${ap.role}; author must revise and resubmit`); }
  else if (sa.approvals.every(x => SA_DONE.includes(x.st))){ sa.status = 'Approved'; log('svc-reqgov (flow F5)', 'Assessment approved', `${b.id} / ${sa.id}`, `All ${sa.approvals.length} reviewers approved; ready for L4`); }
  state.form = null; toast(`${sa.id}: ${ap.role} ${ap.st.toLowerCase()}`); render();
}

function saDelete(){
  const b = getBcr(state.bcr), sa = b.sa, note = document.getElementById('sa-delnote').value.trim();
  if (!note) return formError('Give a reason for deleting the assessment.');
  log(SA_AUTHOR, 'Solution assessment deleted', `${b.id} / ${sa.id}`, `Moved to recycle bin: ${note}`);
  b.sa = null; state.form = null; toast(`${sa.id} deleted`); render();
}

/* ---------- Level 5: test cases ---------- */
const QA_LEAD = 'Latifa Bucheeri', TESTERS = ['Omar Saleh','Huda Saleem'], TC_AUTHOR = 'Huda Saleem';
const uatLocked = b => !!b.uat && b.uat.status === 'Signed Off';

     ${fld('chg-type','Change type', sel('chg-type', L('chgType'), v.type))}${fld('chg-risk','Risk level', sel('chg-risk', L('risk'), v.risk))}
     ${fld('chg-release','Planned release date', `<input id="chg-release" type="date" value="${esc(v.release)}">`)}${fld('chg-window','Implementation window', `<input id="chg-window" value="${esc(v.window || '')}" placeholder="e.g. Fri 23:00–02:00">`)}

function chgSave(){
  const b = getBcr(state.bcr), f = state.form;
  const next = {type:val('chg-type'), risk:val('chg-risk'), release:val('chg-release'), window:val('chg-window'), rollback:val('chg-rollback')};
  if (!next.release) return formError('Set the planned release date.');
  if (!next.rollback) return formError('Add the rollback plan.');
  if (!isEmergency(next.type) && !uatLocked(b)) return formError('UAT must be signed off before a Normal or Standard change. Use Emergency, approved by ECAB, for an urgent fix.');
  if (f.kind === 'chg-add'){
    const itsm = val('chg-itsm');
    if (itsm && !/^CHG-\d{5}$/.test(itsm)) return formError('Use the ITSM format CHG-00000, or leave it blank.');
    const id = itsm || 'CHG-' + String(DB.chgCounter++).padStart(5,'0');
    b.chg = {id, ...next, status:'Draft', cab:'Not Submitted', deploy:'Not Scheduled', pir:'Not Due', approvals:[], author:CHG_AUTHOR, ver:1};
    log(CHG_AUTHOR, 'Change request created', `${b.id} / ${id}`, `Draft ${next.type} change, ${next.risk} risk, release ${fmtDate(next.release)}`);
    state.form = null; toast(`${id} saved as draft`); return render();
  }
  const c = b.chg, names = {type:'change type', risk:'risk level', release:'release date', window:'window', rollback:'rollback plan'};
  const changed = Object.keys(next).filter(k => next[k] !== (c[k] || ''));
  if (!changed.length) return formError('Nothing has changed.');
  const wasSubmitted = c.status === 'Submitted';
  Object.assign(c, next); c.ver = (c.ver || 1) + 1;
  if (wasSubmitted || c.status === 'Rejected'){ Object.assign(c, {status:'Draft', cab:'Not Submitted', approvals:[]}); }
  log(CHG_AUTHOR, 'Change request edited', `${b.id} / ${c.id}`, `Version ${c.ver}: changed ${changed.map(k => names[k]).join(', ')}${wasSubmitted ? '; returned to Draft, approvals cleared' : ''}`);
  state.form = null; toast(`${c.id} saved as version ${c.ver}`); render();
}
function chgSubmit(){
  const b = getBcr(state.bcr), c = b.chg; state.notice = null;
  if (!c.rollback){ state.notice = {where:'chg', ok:false, text:'Add a rollback plan before submitting.'}; return render(); }
  if (!isEmergency(c.type) && !uatLocked(b)){ state.notice = {where:'chg', ok:false, text:'UAT must be signed off first, or change the type to Emergency.'}; return render(); }
  Object.assign(c, {status:'Submitted', cab:'Pending', approvals: chgReviewers(c.type).map(r => ({...r, st:'Pending', note:''}))});
  log('svc-reqgov (flow F8)', 'Change submitted for approval', `${b.id} / ${c.id}`, `Routed to ${c.approvals.map(a => a.role).join(', then ')}`);
  toast(`${c.id} submitted`); render();
}
function chgReview(decision){
  const b = getBcr(state.bcr), c = b.chg, ap = c.approvals[Number(state.form.role)], who = val('rv-who'), note = val('rv-note'), trace = `${b.id} / ${c.id}`;
  if (chgNext(c) !== ap) return formError('An earlier approver must decide first.');
  if (who === c.author && who !== ap.who) return formError(`Segregation of duties: ${who} raised this change and cannot approve it.`);
  if (who !== ap.who) return formError(`${ap.role} decides this step (${ap.who}).`);
  if (decision === 'reject' && !note) return formError('Explain why the change is rejected.');
  ap.st = decision === 'reject' ? 'Rejected' : 'Approved'; ap.note = note;
  log(who, `Change ${ap.st.toLowerCase()}`, trace, `${ap.role}${note ? ': ' + note : ''}`);
  if (ap.st === 'Rejected') Object.assign(c, {status:'Rejected', cab:'Rejected'});
  else if (!chgNext(c)){ Object.assign(c, {status:'Approved', cab:'Approved', deploy:'Scheduled'}); log('svc-reqgov (flow F8)', 'Change approved', trace, `All approvals complete; scheduled for ${fmtDate(c.release)}`); }
  state.form = null; toast(`${c.id}: ${ap.role} ${ap.st.toLowerCase()}`); render();
}
function chgDeploy(){
  const b = getBcr(state.bcr), c = b.chg, outcome = val('dp-outcome'), date = val('dp-date'), note = val('dp-note');

  state.form = null; toast(`${c.id}: ${outcome.toLowerCase()}`); render();
}

function doDelete(){

/* ---------- Admin: customisable dropdown lists ---------- */
const ADMIN_USER = 'Platform Owner';
function forEachField(key, cb){
  DB.bcrs.forEach(b => {
    const frs = b.brs.flatMap(r => r.frs), tcs = b.brs.flatMap(r => r.tcs);
    ({
      areas: () => cb(b, 'area'), bcrPriority: () => cb(b, 'priority'),
      systems: () => { cb(b, 'systems'); frs.forEach(f => cb(f, 'sys')); if (b.sa) cb(b.sa, 'systems'); },
      brPriority: () => b.brs.forEach(r => cb(r, 'pri')), complexity: () => frs.forEach(f => cb(f, 'cx')),
      vendor: () => b.sa && cb(b.sa, 'vendor'), approach: () => b.sa && cb(b.sa, 'atype'),
      risk: () => { if (b.sa) cb(b.sa, 'risk'); if (b.chg) cb(b.chg, 'risk'); },
      testTypes: () => tcs.forEach(t => cb(t, 'type')), testResults: () => tcs.forEach(t => cb(t, 'r')),
      chgType: () => b.chg && cb(b.chg, 'type'), deployOutcomes: () => b.chg && cb(b.chg, 'deploy'),
      pirOutcomes: () => b.chg && cb(b.chg, 'pir', 'Completed – ')
    })[key]();
  });
}
function usage(key, v){
  let n = 0;
  forEachField(key, (o, p, pre = '') => { const cur = o[p]; if (Array.isArray(cur) ? cur.includes(v) : cur === pre + v) n++; });
  return n;
}
function renameValue(key, from, to){
  let n = 0;
  forEachField(key, (o, p, pre = '') => {
    const cur = o[p];
    if (Array.isArray(cur)){ if (cur.includes(from)){ o[p] = cur.map(x => x === from ? to : x); n++; } }
    else if (cur === pre + from){ o[p] = pre + to; n++; }
  });
  return n;
}
function adminError(t){ state.adminMsg = {ok:false, text:t}; render(); }
function adminDone(t){ state.adminMsg = {ok:true, text:t}; toast(t); render(); }

    </section>
  </div>`;
}
function adminChange(el){
  const key = state.adminList || Object.keys(DB.lists)[0], list = DB.lists[key], i = Number(el.dataset.i), x = list.values[i], rec = `Admin / ${list.label}`;
  if (el.dataset.adm === 'rename'){
    const to = el.value.trim(), from = x.v;
    if (to === from) return;
    if (!to) return adminError('A value cannot be empty.');
    if (list.values.some((y, j) => j !== i && y.v.toLowerCase() === to.toLowerCase())) return adminError(`"${to}" is already in this list.`);
    x.v = to; const n = renameValue(key, from, to);
    log(ADMIN_USER, 'List value renamed', rec, `${from} → ${to}; ${n} record${n === 1 ? '' : 's'} updated`);
    return adminDone(`Renamed to "${to}" and updated ${n} record${n === 1 ? '' : 's'}`);
  }
  if (el.dataset.adm === 'owner'){
    const to = el.value.trim(); if (!to) return adminError('Enter the System Owner’s name.');
    const from = x.owner; x.owner = to; log(ADMIN_USER, 'System Owner changed', rec, `${x.v}: ${from || '—'} → ${to}`); return adminDone(`${x.v} System Owner set to ${to}`);
  }
  if (el.dataset.adm === 'oprisk'){ x.oprisk = el.checked; log(ADMIN_USER, 'Review rule changed', rec, `${x.v}: Operational Risk review ${x.oprisk ? 'required' : 'not required'}`); return adminDone(`Updated ${x.v}`); }
  if (el.dataset.adm === 'route'){ x.route = el.value; log(ADMIN_USER, 'Approval route changed', rec, `${x.v}: ${ROUTES[x.route]}`); return adminDone(`${x.v} now routes to ${ROUTES[x.route]}`); }
}

  const key = state.adminList || Object.keys(DB.lists)[0], list = DB.lists[key], rec = `Admin / ${list.label}`;
  if (act === 'admlist'){ state.adminList = t.dataset.key; state.adminMsg = null; return render(); }
  const i = Number(t.dataset.i), x = list.values[i];
  if (act === 'admmove'){ const j = i + Number(t.dataset.d); if (j < 0 || j >= list.values.length) return;
    [list.values[i], list.values[j]] = [list.values[j], list.values[i]]; log(ADMIN_USER, 'List reordered', rec, `${x.v} moved to position ${j + 1}`); state.adminMsg = null; return render(); }
  if (act === 'admdel'){
    if (list.locked.includes(x.v)) return adminError(`${x.v} drives a workflow rule and can't be removed.`);
    const n = usage(key, x.v); if (n) return adminError(`${x.v} is used by ${n} record${n === 1 ? '' : 's'}. Rename it, or change those records first.`);
    if (list.values.length === 1) return adminError('A list needs at least one value.');
    list.values.splice(i, 1); log(ADMIN_USER, 'List value removed', rec, x.v); return adminDone(`Removed "${x.v}"`);
  }
}
function adminAdd(){
  const key = state.adminList || Object.keys(DB.lists)[0], list = DB.lists[key], v = val('adm-new');
  if (!v) return adminError('Type the value to add.');
  if (list.values.some(y => y.v.toLowerCase() === v.toLowerCase())) return adminError(`"${v}" is already in this list.`);
  const item = {v};
  if (list.attr === 'owner'){ item.owner = val('adm-new-o'); if (!item.owner) return adminError('Enter the System Owner for the new system.'); }
  if (list.attr === 'oprisk') item.oprisk = document.getElementById('adm-new-r').checked;
  if (list.attr === 'route') item.route = val('adm-new-t');
  list.values.push(item);
  log(ADMIN_USER, 'List value added', `Admin / ${list.label}`, `${v}${item.owner ? ' (owner ' + item.owner + ')' : ''}${item.route ? ' · ' + ROUTES[item.route] : ''}${item.oprisk ? ' · Operational Risk review' : ''}`);
  adminDone(`Added "${v}" to ${list.label}`);
}

function vFramework(){
  const L = [
    ['L1','Business Change Request','BCR Register','High-level business drivers and change initiatives.','BCR ID, Title, Business Area, Domain, Requestor, Business Sponsor, Business Justification, Impacted Systems, Priority, Status'],
    ['L2','Business Requirements','Business Requirements','What the business needs, linked to its parent BCR.','BR ID, Parent BCR, Requirement Title, Requirement Statement, Business Justification, Priority, Acceptance Criteria, Business Owner, Status'],
    ['L3','Functional Requirements','Functional Requirements','Functional specifications linked to a specific BR.','FR ID, Parent BR, Functional Requirement, Impacted System, Complexity, Status'],
    ['L4','Solution Assessment','Solution Assessments','Feasibility, vendor involvement and architectural risk for the BCR.','Assessment ID, Parent BCR, Impacted Systems, Vendor Involvement, Implementation Approach, Risk Rating, Estimated Effort, Architecture Approval, Status'],
    ['L5','Testing & UAT','Test Cases · UAT Sign-Offs','Test cases linked to BRs and the business acceptance sign-off.','Test Case ID, Related BR, Description, Result · UAT ID, Parent BCR, Business Owner, UAT Result, Sign-Off Date, Status'],
    ['L6','Change Request','Change Requests','Release management, deployment and post-implementation review.','Change ID, Related BCR, Change Type, Risk Level, CAB Approval, Planned Release Date, Deployment Status, Post Implementation Review']
  ];
  return `<div class="pagehead"><div><h1>Framework</h1><p class="muted">The six-level traceability model and the approval levels that connect it. Each level is a SharePoint list in this site; each child record looks up to its parent.</p></div></div>
  <section class="ref-levels">${L.map(l => `<article class="lvl"><span class="n">${l[0]} · list: ${esc(l[2])}</span><h3>${esc(l[1])}</h3><p>${esc(l[3])}</p><div class="fields"><span class="label">Fields</span><br>${esc(l[4])}</div></article>`).join('')}</section>
  <section class="panel"><header><h2>Level approval matrix</h2><span class="muted" style="font-size:.8rem">SLAs in working days, Sunday–Thursday</span></header>
  <div class="tbl-wrap"><table><thead><tr><th>Level</th><th>Decision</th><th>Approvers</th><th>SLA</th></tr></thead><tbody>
  ${GATES.map(g => `<tr><td class="mono">${g.code}</td><td><b>${g.name}</b></td><td>${esc(g.who)}</td><td class="num">${g.sla ? g.sla+' days' : 'Immediate'}</td></tr>`).join('')}
  </tbody></table></div></section>
  <section class="panel"><header><h2>Controls in this prototype</h2></header>
    <ul style="margin:0;padding-left:18px;display:grid;gap:6px;max-width:75ch">
      <li>Each functional requirement is approved on its own by the System Owner of its impacted system.</li>
      <li>Each business requirement is approved on its own by its Business Owner, and only once all of its FRs are approved. Adding an FR to an approved BR reopens it.</li>
      <li>A level is approved only when its entry criteria pass, as the Power Automate flow would check them.</li>
      <li>Segregation of duties: a requestor cannot approve their own BCR, and a test executor cannot sign UAT.</li>
      <li>Every decision is written to the audit log with the approver, time and comments.</li>
      <li>UAT sign-off raises the change request automatically; CAB approval deploys and closes the BCR.</li>
    </ul></section>`;
}

/* ---------- actions ---------- */
function decide(kind){
  const b = getBcr(state.bcr); const who = document.getElementById('d-who').value; const note = document.getElementById('d-note').value.trim();
  const g = GATES[b.gate];
  if (kind === 'return'){
    if (!note){ state.flash = {ok:false, text:'Add a comment so the owner knows what to fix.'}; return render(); }
    b.returned = true; log(who, `Level ${g.code} returned`, b.id, note);
    state.flash = {ok:true, text:`Returned to the owner. The decision is logged.`}; toast(`${b.id} returned at ${g.code}`); return render();
  }
  if (b.gate === 1 && who === b.requestor){ state.flash = {ok:false, text:'Segregation of duties: the requestor cannot approve their own BCR. Choose the sponsor or Demand Manager.'}; log('svc-reqgov (flow F2)','Approval blocked', b.id, `${who} is the requestor`); return render(); }
  const executors = b.brs.flatMap(r=>r.tcs).map(t=>t.by).filter(Boolean);
  if (b.gate === 5 && executors.includes(who)){ state.flash = {ok:false, text:`Segregation of duties: ${who} executed test cases for this BCR and cannot sign UAT.`}; log('svc-reqgov (flow F7)','Sign-off blocked', b.id+' / '+(b.uat?.id||'UAT'), `${who} is a test executor`); return render(); }
  if (!approverOptions(b).expected.includes(who)){ state.flash = {ok:false, text:`${who} is not an approver for ${g.code} in the Approval Matrix.`}; return render(); }
  const failed = criteria(b).filter(c => !c.ok);
  if (failed.length){ state.flash = {ok:false, text:`${g.code} cannot be approved yet: ${failed.map(c=>c.t.toLowerCase()).join('; ')}.`}; log('svc-reqgov (flow)', 'Level entry check failed', b.id, failed.map(c=>c.t).join('; ')); return render(); }

  b.returned = false;
  log(who, `Level ${g.code} approved`, b.id, note || g.name + ' approved');
  if (b.gate === 3) b.brs.forEach(r => { r.status = 'Baselined'; });
  if (b.gate === 5){
    b.brs.forEach(r => r.status = 'Verified');
    if (!b.chg){ const id = 'CHG-' + String(DB.chgCounter++).padStart(5,'0');
      b.chg = {id, type:(L('chgType').find(t => chgRoute(t) === 'cm-cab') || L('chgType')[0]), risk:b.sa?.risk || L('risk')[0], release:addDays(TODAY,14), window:'', rollback:'', status:'Draft', cab:'Not Submitted', deploy:'Not Scheduled', pir:'Not Due', approvals:[], author:CHG_AUTHOR, ver:1};
      log('svc-reqgov (flow F8)','Change request created', `${b.id} / ${id}`, 'Draft Normal change; add the rollback plan and submit to CAB'); }
  }
  if (b.gate === 6) log('svc-reqgov (flow F9)','BCR closed', b.id, 'Change deployed, PIR completed, records locked');
  b.gate += 1; b.since = TODAY;
  state.flash = {ok:true, text: b.gate === 7 ? 'The change is deployed, the PIR is complete and the BCR is closed.' : `${g.code} approved. The request now waits on ${GATES[b.gate].code} ${GATES[b.gate].name}.`};
  toast(`${b.id}: ${g.code} approved`); render();
}

function submitNew(){
  const v = id => document.getElementById(id).value.trim();
  const systems = L('systems').filter((s,i) => document.getElementById('n-sys-'+i).checked);
  const missing = [];
  if (!v('n-title')) missing.push('title'); if (!v('n-domain')) missing.push('domain');
  if (!systems.length) missing.push('at least one impacted system'); if (v('n-just').length < 20) missing.push('a business justification of 20 characters or more');
  if (missing.length){ state.flash = {ok:false, text:`L0 check failed. Add ${missing.join(', ')}.`}; return render(); }
  if (v('n-req') === v('n-sp')){ state.flash = {ok:false, text:'L0 check failed. The business sponsor must be a different person from the requestor.'}; return render(); }
  const id = 'BCR-2026-' + String(++DB.counter).padStart(3,'0');
  DB.bcrs.unshift({id, title:v('n-title'), area:v('n-area'), domain:v('n-domain'), requestor:v('n-req'), sponsor:v('n-sp'), just:v('n-just'), systems,
    priority:v('n-pri'), gate:1, since:TODAY, reg:document.getElementById('n-reg').checked, target:v('n-target') || null, created:TODAY, brs:[], sa:null, uat:null, chg:null});
  log('svc-reqgov (flow F1)','ID issued', id, 'L0 validation passed; status set to Submitted');
  state.flash = null; toast(`${id} submitted for L1 approval`); go('detail', id);
}

function scrollToForm(){ try { const el = document.querySelector('.inline-form'); if (el) el.scrollIntoView({block:'start', behavior:'smooth'}); } catch(e){} }
let tt;
function toast(t){ const el = document.getElementById('toast'); el.textContent = t; el.hidden = false; clearTimeout(tt); tt = setTimeout(() => el.hidden = true, 2800); }

function render(){
  renderTabs();
  const v = {overview:vOverview, register:vRegister, detail:vDetail, approvals:vApprovals, audit:vAudit, framework:vFramework, admin:vAdmin, new:vNew}[state.view] || vOverview;
  document.getElementById('app').innerHTML = v();
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const a = t.dataset.act;
  if (a === 'nav'){ state.flash = null; go(t.dataset.view); }
  if (a === 'open'){ state.flash = null; go('detail', t.dataset.id); }
  if (a === 'addbr'){ state.form = {kind:'br'}; render(); document.getElementById('br-title')?.focus(); }
  if (a === 'addfr'){ state.form = {kind:'fr', br:t.dataset.br}; render(); const el = document.getElementById('fr-desc'); el?.focus(); el?.scrollIntoView({block:'center'}); }
  if (a === 'review'){ go('detail', t.dataset.id); state.form = {kind:t.dataset.kind, br:t.dataset.br, fr:t.dataset.fr, tc:t.dataset.tc, role:t.dataset.role}; render(); scrollToForm(); }
  if (a === 'view' || a === 'edit'){ if (state.view !== 'detail' || (t.dataset.id && state.bcr !== t.dataset.id)) go('detail', t.dataset.id);
    state.form = {kind:t.dataset.kind, br:t.dataset.br, fr:t.dataset.fr}; render();
    document.getElementById(a === 'view' ? 'viewitem' : (t.dataset.kind === 'efr' ? 'editfr' : 'editbr'))?.scrollIntoView({block:'start'}); }
  if (a === 'cancelform'){ state.form = null; render(); }
  if (a === 'sa' || a === 'tc'){ state.notice = null; state.form = {kind:t.dataset.kind, role:t.dataset.role, br:t.dataset.br, tc:t.dataset.tc}; render(); scrollToForm(); }
  if (a === 'uatstart') uatAction('start');
  if (a === 'uatrequest') uatAction('request');
  if (a === 'uatreopen') uatAction('reopen');
  if (a === 'chgsubmit') chgSubmit();
  if (a === 'dodelete') doDelete();
  if (a === 'admlist' || a === 'admmove' || a === 'admdel') adminAction(a, t);
  if (a === 'sasubmit') saSubmit();
  if (a === 'sadelete') saDelete();
  if (a === 'reset'){ DB = normalize(clone(SEED)); state = {view:'overview', bcr:null, flash:null, regFilter:{q:'',area:'',pri:''}, auditFilter:''}; render(); toast('Demo data reset'); }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'decide') decide(e.submitter?.dataset.decision || 'approve');
  if (e.target.id === 'newbcr') submitNew();
  if (e.target.id === 'addbr') submitBr();
  if (e.target.id === 'addfr') submitFr();
  if (e.target.id === 'editbr' || e.target.id === 'editfr') saveEdit();
  if (e.target.id === 'saedit') saSave();
  if (e.target.id === 'admadd') adminAdd();
  const dec = e.submitter?.dataset.decision || 'approve';
  if (e.target.id === 'tcedit') tcSave();
  if (e.target.id === 'tcreview') tcReview(dec);
  if (e.target.id === 'tcresult') tcResult();
  if (e.target.id === 'uatedit') uatSave();
  if (e.target.id === 'uatreview') uatReview(dec);
  if (e.target.id === 'chgedit') chgSave();
  if (e.target.id === 'chgreview') chgReview(dec);
  if (e.target.id === 'chgdeploy') chgDeploy();
  if (e.target.id === 'chgpir') chgPir();
  if (e.target.id === 'sareview') saReview(e.submitter?.dataset.decision || 'approve');
  if (e.target.id === 'reviewitem') submitReview(e.submitter?.dataset.decision || 'approve');
});
document.addEventListener('toggle', e => { if (e.target.classList?.contains('history')) state.histOpen = e.target.open; }, true);
document.addEventListener('input', e => {
  if (e.target.id === 'f-q'){ state.regFilter.q = e.target.value; const pos = e.target.selectionStart; render(); const el = document.getElementById('f-q'); el.focus(); try{ el.setSelectionRange(pos,pos);}catch(_){} }
});
document.addEventListener('change', e => {
  if (e.target.dataset && e.target.dataset.adm) return adminChange(e.target);
  if (e.target.id === 'f-area'){ state.regFilter.area = e.target.value; render(); }
  if (e.target.id === 'f-pri'){ state.regFilter.pri = e.target.value; render(); }
  if (e.target.id === 'f-audit'){ state.auditFilter = e.target.value; render(); }
});
const h = (location.hash || '').slice(1);
if (['overview','register','approvals','audit','framework','admin'].includes(h)) state.view = h;
DB = normalize(clone(SEED));
render();
</script>
